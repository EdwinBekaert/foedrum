# CI on all three platforms (ADR 0010); see issue #2.
# From ADR 0004: npm ci, npm audit signatures, SHA-pinned actions and the lockfile
# checker (scripts/check-deps.ts, #3); npm audit once per run (ADR 0119).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests share a group per ref; pushes and nightly runs get one per commit, since a
  # group keeps only one pending run and would drop a merge commit's run behind the next.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Only superseded pull request runs: every merge commit on main must finish its run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The newest Node 24 on every platform (ADR 0119); a newer major is a change of its own.
          node-version: "24"
          check-latest: true
          cache: npm

      # devEngines in package.json makes npm ci refuse an npm that is too old.
      - name: Versions
        run: |
          node --version
          npm --version

      - run: npm ci

      # The dependency guard with publish dates (DEPENDENCIES.md): it reads the registry and does
      # not depend on the platform, so one leg is enough. npm run check runs its offline rules.
      - name: Dependency guard
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: npm run check:deps

      # Checks the packages installed on this leg, so it runs on every leg. The advisory audit runs
      # once per run, in the audit job (ADR 0119).
      - run: npm audit signatures

      # The same command contributors run locally; npm test enforces the coverage thresholds and
      # fails when one test file takes more than 5 s (scripts/test-budget-reporter.ts). The time
      # it took goes to the summary: it should stay under 20 s on a developer machine (ADR 0021).
      - name: npm run check
        id: check
        run: |
          start=$(date +%s)
          status=0
          npm run check 2>&1 | tee "$RUNNER_TEMP/check.log" || status=$?
          echo "npm run check took $(( $(date +%s) - start )) s" | tee "$RUNNER_TEMP/check-time.txt"
          exit "$status"

      # The sandbox check steps run in on Linux (ADR 0076), so its integration test runs against
      # the real bwrap here instead of skipping; and slirp4netns, the user-mode network stack a
      # setup's network namespace gets the network from, whose cases fail on CI without it. Ubuntu
      # lets slirp4netns into user namespaces through its own AppArmor profile, and keeps pasta out
      # under passt's (ADR 0218).
      - name: Install bubblewrap and slirp4netns
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get install -y bubblewrap slirp4netns

      # Ubuntu 24.04 and later restrict unprivileged user namespaces, which bwrap needs; the
      # profile below is the one Claude Code's sandbox docs give for it ("Ubuntu 24.04 and later:
      # allow bubblewrap to create user namespaces", https://code.claude.com/docs/en/sandboxing).
      # It applies to bwrap itself, not to what runs inside the sandbox. foedrum doctor gives a
      # user the same advice (ADR 0076).
      - name: Let bubblewrap create user namespaces
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' '' \
            'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' \
            '  include if exists <local/bwrap>' '}' | sudo tee /etc/apparmor.d/bwrap > /dev/null
          sudo systemctl reload apparmor

      # Tests against the real tools, kept out of npm run check (ADR 0021). The nightly run is
      # this same job, so they run there on every leg too.
      - name: npm run test:integration
        run: npm run test:integration

      # TEMPORARY (#425): whether a setup's bwrap with a /dev built without devpts makes one user
      # namespace that slirp4netns and pasta can join. Removed before the pull request is ready.
      - name: Verify the setup's network namespace without devpts
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        continue-on-error: true
        run: |
          set +e
          sudo apt-get install -y passt > /dev/null 2>&1; pasta --version | head -1; slirp4netns --version | head -1
          dev=(--tmpfs /dev)
          for node in null zero full random urandom tty; do dev+=(--dev-bind "/dev/$node" "/dev/$node"); done
          dev+=(--tmpfs /dev/shm --symlink /proc/self/fd /dev/fd --symlink /proc/self/fd/0 /dev/stdin
            --symlink /proc/self/fd/1 /dev/stdout --symlink /proc/self/fd/2 /dev/stderr)
          try() {
            local stack=$1 info="$RUNNER_TEMP/info-$1.json"
            local args=(--die-with-parent --unshare-pid --new-session --unshare-net --info-fd 3
              --ro-bind / / "${dev[@]}" --proc /proc --tmpfs /tmp sleep 60)
            echo "== $stack: bwrap ${args[*]}"
            bwrap "${args[@]}" 3> "$info" &
            local holder=$!
            sleep 2
            local pid; pid=$(grep -o '"child-pid": *[0-9]*' "$info" | grep -o '[0-9]*$')
            local u n; u=$(readlink /proc/$pid/ns/user | grep -o '[0-9]*'); n=$(readlink /proc/$pid/ns/net | grep -o '[0-9]*')
            echo "child $pid: user $u (parent $(sudo lsns -t user -n -o NS,PNS | awk -v u="$u" '$1==u {print $2}')), net $n owned by $(sudo lsns -t net -n -o NS,ONS | awk -v n="$n" '$1==n {print $2}')"
            nsenter --target "$pid" --user --net --preserve-credentials true; echo "nsenter user and net: $?"
            local stackpid=""
            case $stack in
              slirp4netns)
                slirp4netns --configure --mtu=65520 --disable-host-loopback "$pid" tap0 > "$RUNNER_TEMP/slirp.log" 2>&1 &
                stackpid=$!; sleep 2; echo "slirp4netns running: $(kill -0 $stackpid 2>/dev/null && echo yes || echo no)"; cat "$RUNNER_TEMP/slirp.log" ;;
              pasta)
                pasta --config-net --quiet -4 -a 10.0.2.100 -n 24 -g 10.0.2.2 --no-map-gw -t none -u none -T none -U none --dns-forward 10.0.2.3 "$pid"
                echo "pasta exit: $?" ;;
            esac
            nsenter --target "$pid" --user --net --preserve-credentials ip -br addr
            nsenter --target "$pid" --user --net --preserve-credentials ip route
            [ -n "$stackpid" ] && kill "$stackpid"
            kill "$holder"; wait "$holder" 2>/dev/null
          }
          try slirp4netns
          try pasta
          sudo dmesg | grep -iE 'apparmor="DENIED"' | tail -20

      # The properties of invariants I1–I6 with many more seeds than npm run check runs within its
      # per-file budget (architecture §9): 500 scenarios per invariant on the Linux leg, and 1,000
      # on every leg in the nightly run. The scenarios are a pure function of the seed and the code
      # has no platform edge, so one leg per pull request is enough (ADR 0134). A failure names its
      # seed; FOEDRUM_SEED replays it on any platform.
      - name: Property tests, more seeds
        if: ${{ github.event_name == 'schedule' || matrix.os == 'ubuntu-latest' }}
        env:
          FOEDRUM_RUNS: ${{ github.event_name == 'schedule' && '1000' || '500' }}
        run: node scripts/with-checkout-tmp.ts --test "test/property/**/*.test.ts"

      # The engine killed at random points and restarted (#15, ADR 0033): 1,000 runs on every leg
      # in the nightly run, the M0 exit criterion, and 200 on the Linux leg of every other run
      # (ADR 0134). Their platform edge, the SQLite file and the driver lock, gets npm run check's
      # 5 runs on every leg per pull request. A failure names its seed; FOEDRUM_SEED replays it.
      - name: Chaos tests, more runs
        if: ${{ github.event_name == 'schedule' || matrix.os == 'ubuntu-latest' }}
        env:
          FOEDRUM_RUNS: ${{ github.event_name == 'schedule' && '1000' || '200' }}
        run: node scripts/with-checkout-tmp.ts --test "test/chaos/**/*.test.ts"

      - name: Check summary
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        run: |
          {
            echo "### npm run check (${{ matrix.os }})"
            cat "$RUNNER_TEMP/check-time.txt" 2>/dev/null || echo "npm run check did not finish"
            echo '```'
            sed -n '/^test file times/,/^end of test file times/p;/^✖ .* over the .* budget/p' "$RUNNER_TEMP/check.log"
            echo '```'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' "$RUNNER_TEMP/check.log" | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # npm audit --omit=dev asks the advisory endpoint about the lockfile, which is the same on every
  # leg, so it runs once per run (ADR 0119). A server error or no answer gets one retry after 30 s;
  # a finding, a client error or a second failure fails the job, so an outage never reads as "no
  # advisories". Dependabot alerts (ADR 0113) cover the time between runs.
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true

      # No npm ci: npm audit reads package-lock.json when node_modules is missing, and the script
      # needs no package.
      - run: npm run audit:advisories

  # The single required status check: green only when every platform and the audit passed.
  ci-ok:
    if: ${{ always() }}
    needs: [check, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All checks passed
        env:
          CHECK: ${{ needs.check.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          echo "check: $CHECK"
          echo "audit: $AUDIT"
          test "$CHECK" = success && test "$AUDIT" = success
