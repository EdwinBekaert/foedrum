# CI on all three platforms (ADR 0010); see issue #2.
# From ADR 0004: npm ci, npm audit signatures, SHA-pinned actions and the lockfile
# checker (scripts/check-deps.ts, #3); npm audit once per run (ADR 0119).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests share a group per ref; pushes and nightly runs get one per commit, since a
  # group keeps only one pending run and would drop a merge commit's run behind the next.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Only superseded pull request runs: every merge commit on main must finish its run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The newest Node 24 on every platform (ADR 0119); a newer major is a change of its own.
          node-version: "24"
          check-latest: true
          cache: npm

      # devEngines in package.json makes npm ci refuse an npm that is too old.
      - name: Versions
        run: |
          node --version
          npm --version

      - run: npm ci

      # The dependency guard with publish dates (DEPENDENCIES.md): it reads the registry and does
      # not depend on the platform, so one leg is enough. npm run check runs its offline rules.
      - name: Dependency guard
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: npm run check:deps

      # Checks the packages installed on this leg, so it runs on every leg. The advisory audit runs
      # once per run, in the audit job (ADR 0119).
      - run: npm audit signatures

      # The same command contributors run locally; npm test enforces the coverage thresholds and
      # fails when one test file takes more than 5 s (scripts/test-budget-reporter.ts). The time
      # it took goes to the summary: it should stay under 20 s on a developer machine (ADR 0021).
      - name: npm run check
        id: check
        run: |
          start=$(date +%s)
          status=0
          npm run check 2>&1 | tee "$RUNNER_TEMP/check.log" || status=$?
          echo "npm run check took $(( $(date +%s) - start )) s" | tee "$RUNNER_TEMP/check-time.txt"
          exit "$status"

      # The sandbox check steps run in on Linux (ADR 0076), so its integration test runs against
      # the real bwrap here instead of skipping.
      - name: Install bubblewrap
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get install -y bubblewrap

      # Tests against the real tools, kept out of npm run check (ADR 0021). The nightly run is
      # this same job, so they run there on every leg too.
      - name: npm run test:integration
        run: npm run test:integration

      # The properties of invariants I1–I6 with many more seeds than npm run check runs within its
      # per-file budget (architecture §9): 500 scenarios per invariant on every leg. A failure
      # names its seed; FOEDRUM_SEED replays it.
      - name: Property tests, more seeds
        env:
          FOEDRUM_RUNS: "500"
        run: node scripts/with-checkout-tmp.ts --test "test/property/**/*.test.ts"

      # The engine killed at random points and restarted (#15, ADR 0033): 1,000 runs in the
      # nightly run, the M0 exit criterion, and 200 on every other run, on every leg. A failure
      # names its seed; FOEDRUM_SEED replays it.
      - name: Chaos tests, more runs
        env:
          FOEDRUM_RUNS: ${{ github.event_name == 'schedule' && '1000' || '200' }}
        run: node scripts/with-checkout-tmp.ts --test "test/chaos/**/*.test.ts"

      - name: Check summary
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        run: |
          {
            echo "### npm run check (${{ matrix.os }})"
            cat "$RUNNER_TEMP/check-time.txt" 2>/dev/null || echo "npm run check did not finish"
            echo '```'
            sed -n '/^test file times/,/^end of test file times/p;/^✖ .* over the .* budget/p' "$RUNNER_TEMP/check.log"
            echo '```'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' "$RUNNER_TEMP/check.log" | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # npm audit --omit=dev asks the advisory endpoint about the lockfile, which is the same on every
  # leg, so it runs once per run (ADR 0119). A server error or no answer gets one retry after 30 s;
  # a finding, a client error or a second failure fails the job, so an outage never reads as "no
  # advisories". Dependabot alerts (ADR 0113) cover the time between runs.
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true

      # No npm ci: npm audit reads package-lock.json when node_modules is missing, and the script
      # needs no package.
      - run: npm run audit:advisories

  # The single required status check: green only when every platform and the audit passed.
  ci-ok:
    if: ${{ always() }}
    needs: [check, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All checks passed
        env:
          CHECK: ${{ needs.check.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          echo "check: $CHECK"
          echo "audit: $AUDIT"
          test "$CHECK" = success && test "$AUDIT" = success
