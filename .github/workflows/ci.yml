# CI on all three platforms (ADR 0010); see issue #2.
# From ADR 0004: npm ci, npm audit signatures, SHA-pinned actions and the lockfile
# checker (scripts/check-deps.ts, #3); npm audit once per run (ADR 0119).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests share a group per ref; pushes and nightly runs get one per commit, since a
  # group keeps only one pending run and would drop a merge commit's run behind the next.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Only superseded pull request runs: every merge commit on main must finish its run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The newest Node 24 on every platform (ADR 0119); a newer major is a change of its own.
          node-version: "24"
          check-latest: true
          cache: npm

      # devEngines in package.json makes npm ci refuse an npm that is too old.
      - name: Versions
        run: |
          node --version
          npm --version

      - run: npm ci

      # The dependency guard with publish dates (DEPENDENCIES.md): it reads the registry and does
      # not depend on the platform, so one leg is enough. npm run check runs its offline rules.
      - name: Dependency guard
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: npm run check:deps

      # Checks the packages installed on this leg, so it runs on every leg. The advisory audit runs
      # once per run, in the audit job (ADR 0119).
      - run: npm audit signatures

      # The command contributors run locally, with --all: every test file, not only the ones the
      # change reaches, through npm test, which enforces the coverage thresholds and fails when one
      # test file takes more than 5 s (scripts/test-budget-reporter.ts). This is the full gate a
      # merge waits for (ADR 0241). The time it took goes to the summary.
      - name: npm run check
        id: check
        run: |
          start=$(date +%s)
          status=0
          npm run check -- --all 2>&1 | tee "$RUNNER_TEMP/check.log" || status=$?
          echo "npm run check took $(( $(date +%s) - start )) s" | tee "$RUNNER_TEMP/check-time.txt"
          exit "$status"

      # The sandbox check steps run in on Linux (ADR 0076), so its integration test runs against
      # the real bwrap here instead of skipping; and slirp4netns, the user-mode network stack a
      # setup's network namespace gets the network from first, whose cases fail on CI without it
      # (ADR 0218).
      - name: Install bubblewrap and slirp4netns
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get install -y bubblewrap slirp4netns

      # Ubuntu 24.04 and later restrict unprivileged user namespaces, which bwrap needs; the
      # profile below is the one Claude Code's sandbox docs give for it ("Ubuntu 24.04 and later:
      # allow bubblewrap to create user namespaces", https://code.claude.com/docs/en/sandboxing).
      # It applies to bwrap itself, not to what runs inside the sandbox. foedrum doctor gives a
      # user the same advice (ADR 0076).
      - name: Let bubblewrap create user namespaces
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' '' \
            'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' \
            '  include if exists <local/bwrap>' '}' | sudo tee /etc/apparmor.d/bwrap > /dev/null
          sudo systemctl reload apparmor

      # Tests against the real tools, kept out of npm run check (ADR 0021). The nightly run is
      # this same job, so they run there on every leg too.
      - name: npm run test:integration
        run: npm run test:integration

      # The properties of invariants I1–I6 with many more seeds than npm run check runs within its
      # per-file budget (architecture §9): 500 scenarios per invariant on the Linux leg, and 1,000
      # on every leg in the nightly run. The scenarios are a pure function of the seed and the code
      # has no platform edge, so one leg per pull request is enough (ADR 0134). A failure names its
      # seed; FOEDRUM_SEED replays it on any platform.
      - name: Property tests, more seeds
        if: ${{ github.event_name == 'schedule' || matrix.os == 'ubuntu-latest' }}
        env:
          FOEDRUM_RUNS: ${{ github.event_name == 'schedule' && '1000' || '500' }}
        run: node scripts/with-checkout-tmp.ts --test "test/property/**/*.test.ts"

      # The engine killed at random points and restarted (#15, ADR 0033): 1,000 runs on every leg
      # in the nightly run, the M0 exit criterion, and 200 on the Linux leg of every other run
      # (ADR 0134). Their platform edge, the SQLite file and the driver lock, gets npm run check's
      # 5 runs on every leg per pull request. A failure names its seed; FOEDRUM_SEED replays it.
      - name: Chaos tests, more runs
        if: ${{ github.event_name == 'schedule' || matrix.os == 'ubuntu-latest' }}
        env:
          FOEDRUM_RUNS: ${{ github.event_name == 'schedule' && '1000' || '200' }}
        run: node scripts/with-checkout-tmp.ts --test "test/chaos/**/*.test.ts"

      - name: Check summary
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        run: |
          {
            echo "### npm run check (${{ matrix.os }})"
            cat "$RUNNER_TEMP/check-time.txt" 2>/dev/null || echo "npm run check did not finish"
            echo '```'
            sed -n '/^test file times/,/^end of test file times/p;/^✖ .* over the .* budget/p' "$RUNNER_TEMP/check.log"
            echo '```'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' "$RUNNER_TEMP/check.log" | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # npm audit --omit=dev asks the advisory endpoint about the lockfile, which is the same on every
  # leg, so it runs once per run (ADR 0119). A server error or no answer gets one retry after 30 s;
  # a finding, a client error or a second failure fails the job, so an outage never reads as "no
  # advisories". Dependabot alerts (ADR 0113) cover the time between runs.
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true

      # No npm ci: npm audit reads package-lock.json when node_modules is missing, and the script
      # needs no package.
      - run: npm run audit:advisories

  # The package as a user gets it (ADR 0377): the JavaScript tsc emits, packed, installed into an
  # empty folder outside the checkout, so no module or dependency of the checkout can stand in for
  # one the package lacks, and started there on every platform.
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      # The install folder has a package.json of its own, so the checkout's .npmrc does not reach
      # it: no dependency's install script runs there either.
      npm_config_ignore_scripts: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          cache: npm

      - run: npm ci

      # No prepack script: npm runs none under ignore-scripts, and package.json has no pre or post
      # scripts (ADR 0004).
      - run: npm run build

      - name: Pack
        run: |
          name=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          echo "TARBALL=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/install" "$RUNNER_TEMP/npx"
          echo '{}' > "$RUNNER_TEMP/install/package.json"

      - name: Install the tarball into an empty folder
        working-directory: ${{ runner.temp }}/install
        run: npm install --no-audit --no-fund "$TARBALL"

      # --version, --help and doctor start the installed bin. Doctor exits 1 on a runner without a
      # gh login, and its findings depend on the runner, so only its start is held: exit 0 or 1,
      # and nothing on stderr, where a crash would print its stack.
      - name: Run the installed foedrum
        working-directory: ${{ runner.temp }}/install
        run: |
          foedrum=node_modules/.bin/foedrum
          version=$("$foedrum" --version)
          test "$version" = "$(node -p "require('./node_modules/foedrum/package.json').version")"
          "$foedrum" --help > /dev/null
          status=0
          "$foedrum" doctor > doctor.out 2> doctor.err || status=$?
          cat doctor.out doctor.err
          echo "foedrum doctor exited $status"
          test "$status" -le 1 && test ! -s doctor.err

      # --help and doctor load only some modules; the rest are imported when a command needs them.
      # Every emitted module but the entry point is imported here, without the checkout's
      # devDependencies, so a module that imports one, or reads a file the package does not ship
      # when it loads, fails here and not on a user's first serve or brew.
      - name: Import every installed module
        working-directory: ${{ runner.temp }}/install
        run: |
          node --input-type=module -e "
          import { globSync } from 'node:fs';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const main = join('node_modules', 'foedrum', 'dist', 'cli', 'main.js');
          const files = globSync('node_modules/foedrum/dist/**/*.js').filter((file) => join(file) !== main);
          for (const file of files) await import(pathToFileURL(file).href);
          console.log('imported ' + files.length + ' modules');
          if (files.length === 0) process.exitCode = 1;
          "

      # M3's exit test runs foedrum through npx.
      - name: npx --package=<tarball> foedrum --version
        working-directory: ${{ runner.temp }}/npx
        run: npx --yes --package="$TARBALL" foedrum --version

  # The single required status check: green only when every platform, the package and the audit
  # passed.
  ci-ok:
    if: ${{ always() }}
    needs: [check, package, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All checks passed
        env:
          CHECK: ${{ needs.check.result }}
          PACKAGE: ${{ needs.package.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          echo "check: $CHECK"
          echo "package: $PACKAGE"
          echo "audit: $AUDIT"
          test "$CHECK" = success && test "$PACKAGE" = success && test "$AUDIT" = success
