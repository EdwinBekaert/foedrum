# Dependency updates — see DEPENDENCIES.md and docs/adr/0004
# The 7-day cooldown matches min-release-age in .npmrc; CI enforces it with `npm run check:deps`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
